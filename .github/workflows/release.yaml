name: Go Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # cgo must be enabled so that github.com/mattn/go-sqlite3 works at
          # runtime, so each target is built on its own native runner instead
          # of cross-compiling from ubuntu.
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            asset: dbtestify-linux-amd64
          - runner: windows-latest
            goos: windows
            goarch: amd64
            asset: dbtestify-windows-amd64.exe
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            asset: dbtestify-darwin-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.asset }} ./cmd/dbtestify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
